#
# DigitalOcean App Platform Configuration
# Deploy: Connect your GitHub repo to DigitalOcean App Platform
#

name: wavelength-backend

services:
  - name: api
    # GitHub configuration
    github:
      repo: xSh4doow/WaveLength-AI
      branch: commit1
      deploy_on_push: true

    # Source directory
    source_dir: /Back-End

    # Build configuration
    build_command: pip install -r requirements.txt

    # Run configuration
    run_command: uvicorn src.main:app --host 0.0.0.0 --port $PORT

    # Instance size (Basic: 1GB RAM, $5/mo | Professional: 2GB RAM, $12/mo)
    # With $200 credits: Professional = ~16 months free
    instance_size_slug: professional-xs  # 2GB RAM (recommended for MusicGen)
    instance_count: 1

    # HTTP configuration
    http_port: 8080

    # Health check
    health_check:
      http_path: /health

    # Environment variables
    envs:
      - key: PORT
        value: "8080"

      - key: PYTHON_VERSION
        value: "3.11.0"

      - key: BLIP_MODEL
        value: "Salesforce/blip-image-captioning-large"

      - key: MUSICGEN_MODEL
        value: "facebook/musicgen-small"

      - key: USE_CLIP
        value: "false"

      - key: DEVICE
        value: "cpu"

      # Database URL (automatically injected by DigitalOcean when you add PostgreSQL)
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "${wavelength-db.DATABASE_URL}"

# PostgreSQL Database
databases:
  - name: wavelength-db
    engine: PG
    version: "12"
    production: false  # Dev database (included in free tier)
    cluster_name: wavelength-cluster

# Region
region: nyc

# Alerts (optional)
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
