services:
  - type: web
    name: wavelength-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: Back-End
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
      - key: USE_MOCK_AI
        value: false